# Git hooks. Install once after cloning: npx lefthook install
pre-commit:
  commands:
    lint:
      glob: "*.{mjs,js,ts,tsx,css,json}"
      run: npx biome lint --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm test
