name: Release

# Publishing a GitHub release (tag vX.Y.Z) publishes that version to npm through trusted
# publishing: no npm token is stored, and the package gets a provenance statement.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts
      # prepublishOnly builds the web app and runs the tests before anything is uploaded.
      - run: npm publish
