name: Idea or improvement
description: Suggest a feature, a new member role, a CLI to support, or a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help with
      description: The situation or problem, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
